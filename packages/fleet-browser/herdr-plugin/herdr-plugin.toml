id = "fleet-browser"
name = "Fleet Browser"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Browser lane status, and a ring when a lane needs the captain"
platforms = ["linux", "macos"]

[[panes]]
id = "lanes"
title = "Browser lanes"
placement = "split"
command = ["fleet-browser", "lanes", "--watch", "--notify"]

[[actions]]
id = "lanes"
title = "Show browser lanes"
contexts = ["workspace"]
command = ["sh", "lanes-action.sh"]
