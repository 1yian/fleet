[project]
name = "fleet-browser-solver"
version = "0.1.0"
description = "Vision-model captcha solver that drives a lane's Chrome over CDP"
requires-python = ">=3.13"
dependencies = [
  "hcaptcha-challenger==0.19.0",
  "playwright==1.65.2",
  "httpx==0.28.1",
  "loguru==0.8.0",
  "pydantic==2.14.4",
  "pyyaml==6.0.3",
]

[project.scripts]
fleet-browser-solver = "fleet_browser_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_browser_solver"]

[tool.ruff]
line-length = 120
