# gitleaks settings: the default rules, plus known test values that are not secrets.
[extend]
useDefault = true

[[allowlists]]
description = "The sample Sec-WebSocket-Key from RFC 6455, used by the board socket tests"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "A made-up password that the e2e login fixtures type into a test page, in the commit history"
condition = "AND"
paths = ['''^e2e/support/login-fixtures\.ts$''']
regexes = ['''^Zx9-other-secret-b7e41c0d$''']

[[allowlists]]
description = "A made-up lane token that the home setup e2e test feeds to fleet home add, in the commit history"
condition = "AND"
paths = ['''^e2e/extension/home-setup\.test\.ts$''']
regexes = ['''^-tok-3f9c2a71e8d44b0a$''']

[[allowlists]]
description = "A made-up helper failure value that the reload failure e2e test checks is hidden, in the commit history"
condition = "AND"
paths = ['''^e2e/(support/reload-fault\.ts|extension/reload-failure\.test\.ts)$''']
regexes = ['''sk-labSecretMustNotReachDiagnosticLogs123456''']
