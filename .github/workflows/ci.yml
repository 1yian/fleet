name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cardd: ${{ steps.filter.outputs.cardd }}
      behavior: ${{ steps.filter.outputs.behavior }}
      tests: ${{ steps.filter.outputs.tests }}
      pi: ${{ steps.filter.outputs.pi }}
      cardd-e2e: ${{ steps.filter.outputs.cardd-e2e }}
      extension-e2e: ${{ steps.filter.outputs.extension-e2e }}
      board-e2e: ${{ steps.filter.outputs.board-e2e }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - "packages/**"
              - "e2e/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig.json"
              - "eslint.config.js"
              - "knip.json"
              - ".dependency-cruiser.cjs"
              - ".prettierrc.json"
              - ".prettierignore"
              - ".github/workflows/**"
            cardd:
              - "packages/cardd/**"
            behavior:
              - "packages/*/src/**"
              - "packages/*/migrations/**"
            tests:
              - "e2e/**"
            pi:
              - "e2e/support/harness.ts"
              - "e2e/support/json.ts"
              - "e2e/support/fake-model.ts"
              - "e2e/support/probe.ts"
              - "e2e/pi/**"
              - "e2e/package.json"
              - "package-lock.json"
            board-e2e:
              - "packages/board/**"
              - "packages/cardd/**"
              - "packages/protocol/**"
              - "e2e/board/**"
              - "e2e/support/cardd.ts"
              - "package-lock.json"
            extension-e2e:
              - "packages/**"
              - "e2e/support/**"
              - "e2e/extension/**"
              - "package-lock.json"
            cardd-e2e:
              - "packages/cardd/**"
              - "packages/protocol/**"
              - "e2e/support/cardd.ts"
              - "e2e/support/fleet.ts"
              - "e2e/cardd/**"
              - "package-lock.json"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run knip
      - run: npm run deps

  migrations:
    needs: changes
    if: needs.changes.outputs.cardd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run migrations:check
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner .

  e2e-pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 "e2e/pi/**/*.test.ts"

  e2e-cardd:
    needs: changes
    if: needs.changes.outputs.cardd-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 "e2e/cardd/**/*.test.ts"

  e2e-extension:
    needs: changes
    if: needs.changes.outputs.extension-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install herdr
        env:
          HERDR_VERSION: 0.9.5
          HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        run: |
          curl -fsSL -o herdr "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64"
          echo "${HERDR_SHA256}  herdr" | sha256sum -c -
          chmod +x herdr && sudo mv herdr /usr/local/bin/herdr
      - run: node --test --test-concurrency=1 "e2e/extension/**/*.test.ts"

  e2e-board:
    needs: changes
    if: needs.changes.outputs.board-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 "e2e/board/**/*.test.ts"

  tests-required:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Behavior changes need end-to-end tests
        env:
          BEHAVIOR: ${{ needs.changes.outputs.behavior }}
          TESTS: ${{ needs.changes.outputs.tests }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'no-behavior-change') }}
        run: |
          if [ "$BEHAVIOR" = "true" ] && [ "$TESTS" != "true" ] && [ "$EXEMPT" != "true" ]; then
            echo "::error::This PR changes packages/*/src or migrations but no e2e test."
            echo "Add or update a test under e2e/, or add the 'no-behavior-change' label."
            exit 1
          fi

  ci-ok:
    needs:
      [
        changes,
        static,
        migrations,
        secrets,
        e2e-pi,
        e2e-cardd,
        e2e-extension,
        e2e-board,
        tests-required,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
