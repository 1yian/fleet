name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cardd: ${{ steps.filter.outputs.cardd }}
      behavior: ${{ steps.filter.outputs.behavior }}
      tests: ${{ steps.filter.outputs.tests }}
      pi: ${{ steps.filter.outputs.pi }}
      cardd-e2e: ${{ steps.filter.outputs.cardd-e2e }}
      extension-e2e: ${{ steps.filter.outputs.extension-e2e }}
      board-e2e: ${{ steps.filter.outputs.board-e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            code:
              - "packages/**"
              - "e2e/**"
              - "package.json"
              - "bun.lock"
              - "tsconfig.json"
              - "bunfig.toml"
              - ".oxlintrc.json"
              - "**/oxlint-suppressions.json"
              - ".pi/extensions/**"
              - "**/*.{js,cjs,mjs,ts,tsx,mts,cts}"
              - "**/tsconfig*.json"
              - "knip.json"
              - ".dependency-cruiser.cjs"
              - ".oxfmtrc.json"
              - ".gitleaks.toml"
              - ".githooks/**"
              - ".github/workflows/**"
              - ".github/actions/**"
            cardd:
              - "packages/cardd/**"
            behavior:
              - "packages/*/src/**"
              - "packages/*/migrations/**"
            tests:
              - "e2e/**"
            pi:
              - "e2e/support/harness.ts"
              - "e2e/support/json.ts"
              - "e2e/support/fake-model.ts"
              - "e2e/support/probe.ts"
              - "e2e/pi/**"
              - "e2e/package.json"
              - "bun.lock"
              - ".github/actions/install/**"
              - ".github/actions/install-bun/**"
              - ".github/actions/install-node/**"
              - ".github/actions/download/**"
            board-e2e:
              - "packages/board/**"
              - "packages/cardd/**"
              - "packages/protocol/**"
              - "e2e/board/**"
              - "e2e/support/cardd.ts"
              - "e2e/support/public-host.ts"
              - "bun.lock"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
            extension-e2e:
              - "AGENTS.md"
              - "CONTRIBUTING.md"
              - "packages/**"
              - "e2e/support/**"
              - "e2e/extension/**"
              - "e2e/run.ts"
              - "e2e/durations.json"
              - ".githooks/**"
              - "githooks.js"
              - "format-files.js"
              - ".oxfmtrc.json"
              - "package.json"
              - "lint.js"
              - "bun.lock"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
            cardd-e2e:
              - "packages/cardd/**"
              - "packages/protocol/**"
              - "e2e/support/cardd.ts"
              - "e2e/support/fleet.ts"
              - "e2e/support/public-host.ts"
              - "e2e/cardd/**"
              - "e2e/run.ts"
              - "e2e/durations.json"
              - "bun.lock"
              - ".github/workflows/ci.yml"
              - ".github/actions/install/**"
              - ".github/actions/install-bun/**"
              - ".github/actions/install-node/**"
              - ".github/actions/download/**"

  static:
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run knip
      - run: bun run deps

  migrations:
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.cardd == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-node
      - uses: ./.github/actions/install-bun
      - run: bun run migrations:check
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  secrets:
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download gitleaks
        id: gitleaks
        uses: ./.github/actions/download
        with:
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: Scan the full history
        env:
          ASSET: ${{ steps.gitleaks.outputs.path }}
        run: |
          tar -xzf "$ASSET" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  e2e-pi:
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install
      - run: node --test --test-timeout=300000 --test-concurrency=1 "e2e/pi/**/*.test.ts"

  e2e-cardd:
    timeout-minutes: 30
    name: e2e-cardd (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.cardd-e2e == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FLEET_E2E_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install
      - run: bun run build
      - run: node e2e/run.ts --shard=${{ matrix.shard }}/3 "e2e/cardd/**/*.test.ts"

  e2e-extension:
    timeout-minutes: 30
    name: e2e-extension (${{ matrix.shard }}/9)
    needs: changes
    if: needs.changes.outputs.extension-e2e == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      GH_TOKEN: ${{ github.token }}
      FLEET_E2E_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Install herdr
        uses: ./.github/actions/install-herdr
      - name: Install direnv
        uses: ./.github/actions/install-direnv
        timeout-minutes: 7
      - name: Install Lavish for the extension review tests
        uses: ./.github/actions/install-lavish
        timeout-minutes: 5
        with:
          version: 0.1.90
      - run: bun run build
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        timeout-minutes: 23
      - run: node e2e/run.ts --shard=${{ matrix.shard }}/9 "e2e/extension/**/*.test.ts"

  e2e-board:
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.board-e2e == 'true'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install
      - run: bun run build
      - name: Install Chromium
        uses: ./.github/actions/install-chromium
        timeout-minutes: 23
      - name: Install Lavish for the authenticated browser review
        uses: ./.github/actions/install-lavish
        timeout-minutes: 5
        with:
          version: 0.1.97
      - run: node --test --test-timeout=300000 --test-concurrency=1 "e2e/board/**/*.test.ts"

  tests-required:
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - name: Behavior changes need end-to-end tests
        env:
          BEHAVIOR: ${{ needs.changes.outputs.behavior }}
          TESTS: ${{ needs.changes.outputs.tests }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'no-behavior-change') }}
        run: |
          if [ "$BEHAVIOR" = "true" ] && [ "$TESTS" != "true" ] && [ "$EXEMPT" != "true" ]; then
            echo "::error::This PR changes packages/*/src or migrations but no e2e test."
            echo "Add or update a test under e2e/, or add the 'no-behavior-change' label."
            exit 1
          fi

  ci-ok:
    timeout-minutes: 10
    needs:
      [
        changes,
        static,
        migrations,
        secrets,
        e2e-pi,
        e2e-cardd,
        e2e-extension,
        e2e-board,
        tests-required,
      ]
    if: always()
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","p620-ci"]') || 'ubuntu-latest' }}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
