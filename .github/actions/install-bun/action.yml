name: Install Bun
description: Installs the pinned Bun release into a folder of this job, after checking it against a pinned checksum. Bun's binary, cache, and global packages all stay under RUNNER_TEMP, so nothing is written outside the job.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUN_VERSION: 1.3.13
        BUN_SHA256: 79c0771fa8b92c33aae41e15a0e0d307ea99d0e2f00317c71c6c53237a78e25a
      run: |
        curl -fsSL -o "${RUNNER_TEMP}/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
        echo "${BUN_SHA256}  ${RUNNER_TEMP}/bun.zip" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/bun/bin"
        unzip -q -j -o "${RUNNER_TEMP}/bun.zip" bun-linux-x64/bun -d "${RUNNER_TEMP}/bun/bin"
        ln -sf bun "${RUNNER_TEMP}/bun/bin/bunx"
        rm "${RUNNER_TEMP}/bun.zip"
        echo "BUN_INSTALL=${RUNNER_TEMP}/bun" >> "$GITHUB_ENV"
        echo "${RUNNER_TEMP}/bun/bin" >> "$GITHUB_PATH"
