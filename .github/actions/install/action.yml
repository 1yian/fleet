name: Install dependencies
description: Sets up pinned Node and Bun, then installs the locked dependencies from the Bun cache when possible.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-node
    - uses: ./.github/actions/install-bun
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/bun/install/cache
        key: bun-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.github/actions/install-bun/action.yml') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/bun/install/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
