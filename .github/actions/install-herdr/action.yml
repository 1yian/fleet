name: Install herdr
description: Installs the pinned and verified herdr binary into the job's PATH.
runs:
  using: composite
  steps:
    - id: download
      uses: ./.github/actions/download
      with:
        url: https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64
        sha256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
    - shell: bash
      env:
        ASSET: ${{ steps.download.outputs.path }}
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        install -m 755 "$ASSET" "$RUNNER_TEMP/bin/herdr"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
