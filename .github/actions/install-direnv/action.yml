name: Install direnv
description: Installs the pinned and verified direnv release without using the Ubuntu archive.
runs:
  using: composite
  steps:
    - id: download
      uses: ./.github/actions/download
      with:
        url: https://github.com/direnv/direnv/releases/download/v2.37.1/direnv.linux-amd64
        sha256: 1f1b93dd6f38523fde26dfac96151ef9d31a374e3005cd3345fb93555ae0c9b5
        retries: "5"
        retry-delay: "5"
        retry-max-time: "255"
    - shell: bash
      env:
        ASSET: ${{ steps.download.outputs.path }}
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        install -m 755 "$ASSET" "$RUNNER_TEMP/bin/direnv"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/direnv" version
